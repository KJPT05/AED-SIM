# Supabase pauses free projects after about a week of low activity.
# This reads the Family CPR Challenge total once a day so the counter stays online.
name: Keep challenge counter awake
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read the challenge total
        run: |
          curl -sf -X POST "https://xitozreeepukutoyhpsg.supabase.co/rest/v1/rpc/challenge_total" \
            -H "apikey: sb_publishable_J_sh-cjwm7BYJ4FnDnBoQg_CFimhMYq" \
            -H "Content-Type: application/json" -d '{}'
